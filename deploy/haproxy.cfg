# ==============================================================================
# Realm Stitchers Edge Gateway - HAProxy Production Configuration
# High-Concurrency WebRTC Signaling & Real2Sim Computer Vision Load Balancer
# ==============================================================================

global
    log stdout format raw daemon info
    maxconn 50000
    stats socket /tmp/haproxy.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close

    # Connection and transfer timeouts
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

    # Extended tunnel timeout required for long-lived WebRTC STOMP WebSockets
    timeout tunnel  3600s

    # Standard queue and retry settings
    timeout queue   30000ms
    retries 3

# ------------------------------------------------------------------------------
# Observability & Metrics Dashboard
# ------------------------------------------------------------------------------
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    stats show-legends

# ------------------------------------------------------------------------------
# Frontend Edge Router
# ------------------------------------------------------------------------------
frontend realm_stitchers_edge
    bind *:8080
    mode http

    # Traffic Classification ACLs
    acl is_argon_scan path_beg -i /api/v1/argon/scan
    acl is_stitch_signaling path_beg -i /ws/stitch-signaling
    acl is_websocket_upgrade hdr(Upgrade) -i WebSocket
    acl is_connection_upgrade hdr(Connection) -i Upgrade

    # Route real-to-sim volumetric scan uploads to compute-heavy GPU pool
    use_backend argon_real2sim_gpu_pool if is_argon_scan

    # Route STOMP / WebRTC signaling sessions to sticky hash signaling pool
    use_backend spring_webrtc_signaling if is_stitch_signaling or is_websocket_upgrade or is_connection_upgrade

    # Default fallback routes to core application backend
    default_backend spring_webrtc_signaling

# ------------------------------------------------------------------------------
# Backend: Argon Real2Sim Heavy Compute / GPU Mesh Reconstruction Pool
# Least-connection load balancing ensures heavy volumetric scans distribute evenly
# ------------------------------------------------------------------------------
backend argon_real2sim_gpu_pool
    mode http
    balance leastconn
    option httpchk GET /api/v1/argon/health
    http-check expect status 200

    server gpu-worker-1 realm-stitchers:8080 check inter 5s rise 2 fall 3 maxconn 500
    server gpu-worker-2 realm-stitchers:8080 check inter 5s rise 2 fall 3 maxconn 500 backup

# ------------------------------------------------------------------------------
# Backend: Spring WebRTC STOMP Low-Latency Signaling Pool
# Consistent URI hashing guarantees subscribers for the same room stick to the same node
# ------------------------------------------------------------------------------
backend spring_webrtc_signaling
    mode http
    balance uri
    hash-type consistent
    option httpchk GET /api/v1/argon/health
    http-check expect status 200

    server signaling-node-1 realm-stitchers:8080 check inter 3s rise 2 fall 2 maxconn 25000
    server signaling-node-2 realm-stitchers:8080 check inter 3s rise 2 fall 2 maxconn 25000 backup
